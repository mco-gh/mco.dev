[build]
publish = "public"
command = "hugo"

[context.production.environment]
HUGO_VERSION = "0.69.2"
HUGO_ENV = "production"
HUGO_ENABLEGITINFO = "true"
PYTHON_VERSION = "3.8"

[context.deploy-preview]
command = "hugo -b $DEPLOY_PRIME_URL"

[context.deploy-preview.environment]
HUGO_VERSION = "0.69.2"

[context.branch-deploy]
command = "hugo -b $DEPLOY_PRIME_URL"

[context.branch-deploy.environment]
HUGO_VERSION = "0.56.3"


# The course page moved from /build-an-app to /build (Stripe's sold-out
# messages still point at the old address).
[[redirects]]
from = "/build-an-app/*"
to = "/build/"
status = 301
force = true

[[redirects]]
from = "/build-an-app"
to = "/build/"
status = 301
force = true

# Connect4 was renamed Four.
[[redirects]]
from = "/connect4/*"
to = "/four/:splat"
status = 301
force = true   # old files can linger in the deploy and would otherwise win

[[redirects]]
from = "/connect4"
to = "/four/"
status = 301
force = true

# MM was renamed Code.
[[redirects]]
from = "/mm/*"
to = "/code/:splat"
status = 301
force = true   # old files can linger in the deploy and would otherwise win

[[redirects]]
from = "/mm"
to = "/code/"
status = 301
force = true
